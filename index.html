  // 4. Decodificador seguro binario UTF-8 (sin caídas por acentos o caracteres especiales)
  function _decode(str) {
    try {
      var bin = atob(str);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) {
        bytes[i] = bin.charCodeAt(i);
      }
      return new TextDecoder("utf-8").decode(bytes);
    } catch(err) {
      return "";
    }
  }

  // Inyección limpia directamente en el body para mantener el layout intacto
  document.documentElement.classList.add("anim");
  document.body.innerHTML = _decode(_data);

  // 5. Interactividad
  setTimeout(function(){
    document.documentElement.classList.remove("anim");
  }, 1800);

  var toast = document.getElementById("toast"), t;
  function say(msg){
    if(!toast) return;
    toast.textContent = msg;
    toast.classList.add("on");
    clearTimeout(t);
    t = setTimeout(function(){ toast.classList.remove("on"); }, 2100);
  }

  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  if(!isIOS){
    var note = document.getElementById("walletNote");
    if(note){ note.hidden = false; }
  }

  var share = document.getElementById("shareBtn");
  if(share){
    share.addEventListener("click", function(){
      var data = {
        title: "Jerry Osorno | Jerry Systems",
        text: "La Tecnologia a tu alcance — mi tarjeta digital:",
        url: "https://jerrysystems.github.io/tarjeta/"
      };
      if(navigator.share){
        navigator.share(data).catch(function(){});
        return;
      }
      var done = function(){ say("Enlace copiado"); };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(data.url).then(done, function(){ say(data.url); });
      } else {
        var ta = document.createElement("textarea");
        ta.value = data.url;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); done(); } catch(e){ say(data.url); }
        document.body.removeChild(ta);
      }
    });
  }

  var longPress;
  Array.prototype.forEach.call(document.querySelectorAll(".tile small"), function(el){
    var tile = el.closest(".tile");
    if(!tile) return;
    function start(){
      longPress = setTimeout(function(){
        var txt = el.textContent.trim();
        if(navigator.clipboard){
          navigator.clipboard.writeText(txt).then(function(){
            say("Copiado: " + txt);
          }, function(){});
        }
        if(navigator.vibrate){ navigator.vibrate(12); }
      }, 480);
    }
    function stop(){ clearTimeout(longPress); }
    ["touchstart", "mousedown"].forEach(function(evt){
      tile.addEventListener(evt, start, { passive: true });
    });
    ["touchend", "touchcancel", "mouseup", "mouseleave", "scroll"].forEach(function(evt){
      tile.addEventListener(evt, stop, { passive: true });
    });
  });
})();
